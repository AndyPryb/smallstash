#Sun Aug 16 13:34:04 UTC 2026
micronaut.application.name=smallstash

# --- Auth (Cognito JWT) ---
# Validates tokens in-Lambda as defense-in-depth alongside HTTP API's native
# Cognito JWT authorizer (docs/architecture.md sec 2). Off by default so local
# dev/tests don't need a real Cognito pool - deliberately NOT setting the jwks
# url property here at all (rather than pointing it at a placeholder), since
# an unresolvable JWKS URL can fail bean creation at startup. The real value
# lives in application-lambda.properties, loaded only when deployed - see
# that file for the required env vars.
micronaut.security.enabled=${MICRONAUT_SECURITY_ENABLED:false}

# --- Request limits ---
# Second layer under VaultController's own 512 KiB ciphertext check (see
# MAX_CIPHERTEXT_BYTES there, and docs/todo.md's security review finding
# H-2). Micronaut's default is 10MB; 1MB here leaves room for the Base64
# expansion of a max-size vault (~700KB) plus its JSON envelope, while
# still rejecting anything wildly oversized before it's even deserialized.
micronaut.server.max-request-size=1MB

# --- Storage (docs/decisions/0001-storage-s3-vs-dynamodb.md) ---
smallstash.storage.vault-bucket=${SMALLSTASH_VAULT_BUCKET:smallstash-vaults}
smallstash.storage.users-table=${SMALLSTASH_USERS_TABLE:smallstash-users}
