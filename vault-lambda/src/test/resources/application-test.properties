# Test-only resource names - deliberately NOT the same as application.properties'
# real defaults (smallstash-vaults / smallstash-users). Micronaut Test Resources
# is supposed to transparently redirect S3Client/DynamoDbClient to a local
# LocalStack container during tests, but that redirect has been unreliable in
# this environment (docs/todo.md, 2026-08-28) - when it silently fails, the AWS
# SDK falls through to real AWS using whatever ambient credentials are present,
# and creates whatever bucket/table name is configured. If that name is the
# real production default, this happens invisibly against a real resource. With
# a name no real deploy would ever use, the same failure now fails loudly
# instead (NoSuchBucket / ResourceNotFoundException), and even if it doesn't,
# nothing it creates can be mistaken for real data.
smallstash.storage.vault-bucket=smallstash-test-vaults-do-not-use
smallstash.storage.users-table=smallstash-test-users-do-not-use
