# Loaded only when the "lambda" Micronaut environment is active - set
# MICRONAUT_ENVIRONMENTS=lambda as a deployed-Lambda env var (alongside
# MICRONAUT_SECURITY_ENABLED=true) once the Cognito user pool exists.
# Local dev/tests never activate this environment, so a missing/placeholder
# JWKS URL can't break `mvn test` or `mn:run` - see application.properties.
#
# COGNITO_JWKS_URL example:
#   https://cognito-idp.{region}.amazonaws.com/{userPoolId}/.well-known/jwks.json
micronaut.security.token.jwt.signatures.jwks.cognito.url=${COGNITO_JWKS_URL}

# Claim validation, on top of the signature check above. Without these the
# in-Lambda layer verifies only that *this pool* signed the token - it would
# accept a token minted for any other app client in the same pool. The API
# Gateway JWT authorizer already checks both, so this is the defence-in-depth
# half actually being defence in depth (docs/architecture.md sec 5).
#
# Property names verified against micronaut-security-jwt 5.3.1's
# JwtClaimsValidatorConfigurationProperties, not assumed - see CLAUDE.md's
# working agreement about checking library API claims.
#
# Note what `audience` also buys: Cognito *access* tokens carry no `aud`
# claim (they use `client_id`), and AudienceJwtClaimsValidator rejects a token
# whose audience list is empty. So requiring an audience implicitly enforces
# "must be an ID token issued to this client" - which is what the PWA sends
# (session.js uses idToken) and covers the token_use concern without a custom
# validator.
micronaut.security.token.jwt.claims-validators.issuer=${COGNITO_ISSUER}
micronaut.security.token.jwt.claims-validators.audience=${COGNITO_CLIENT_ID}
