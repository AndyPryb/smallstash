# Loaded only when the "lambda" Micronaut environment is active, same as
# vault-lambda's copy of this file - see that file's comment for the full
# reasoning. Property values and their meaning are identical here; this is
# the "no hand-retyped values to drift" case from
# docs/file-storage-plan.md sec 3a, not independently-authored config.
micronaut.security.token.jwt.signatures.jwks.cognito.url=${COGNITO_JWKS_URL}
micronaut.security.token.jwt.claims-validators.issuer=${COGNITO_ISSUER}
micronaut.security.token.jwt.claims-validators.audience=${COGNITO_CLIENT_ID}
