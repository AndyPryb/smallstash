micronaut.application.name=files-lambda

# --- Auth (Cognito JWT) ---
# Defense-in-depth in-Lambda re-check, same reasoning as vault-lambda's copy
# of this file - see docs/file-storage-plan.md sec 3a. Off by default so
# local dev/tests don't need a real Cognito pool.
micronaut.security.enabled=${MICRONAUT_SECURITY_ENABLED:false}

# --- Request limits ---
# This Lambda never receives file bytes (docs/file-storage-plan.md sec 3 -
# uploads go straight to S3 via presigned POST), so its request bodies are
# small JSON only (mint/commit requests, the encrypted files-index blob).
# Same 1MB ceiling as vault-lambda for consistency, not because anything
# here is expected to approach it.
micronaut.server.max-request-size=1MB

# --- Storage ---
# No users-table property here at all, unlike vault-lambda's copy of this
# file - this Lambda has zero DynamoDB access by design
# (docs/file-storage-plan.md sec 8.5).
smallstash.storage.files-bucket=${SMALLSTASH_FILES_BUCKET:smallstash-files}
